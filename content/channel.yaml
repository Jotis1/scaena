# Perfil del canal: la única fuente del contenido de Scaena (specs/channel-profile).
# Las claves van en inglés; los textos son los del diseño aprobado en Claude Design.
# Se valida al construir (`bun run validate-profile`).

name: Jotis

twitch:
    login: jotis_1

youtube:
    handle: "@jotis_1"

tagline: Juegos a mi ritmo, sin prisa.

description:
    - "Un canal para jugar sin reloj: miro cada rincón, vuelvo por el cofre que me dejé y no cambio de zona hasta verla entera."
    - Entre partida y partida, ratos de Just Chatting.

# Textos de la web: qué es (portada) y la línea del pie.
site:
    intro: Scaena es la web del canal de Twitch de Jotis. Aquí ves si hay directo, cómo va uno y dónde queda cada partida cuando acaba.
    footer: Juegos en modo historia y ratos de charla, sin prisa.

# «Cómo va un directo» en la portada. `hint` es la línea bajo el nombre del paso; sin ella, en «Antes» va la
# hora de inicio de la franja. `where` (twitch o youtube) es la etiqueta junto al titular.
journey:
    before:
        title: Antes
        heading: Aviso y cuenta atrás
        text: No hay días fijos. Si sigues el canal, Twitch te avisa al empezar, y la cuenta atrás deja unos minutos para llegar con calma y algo de beber.
        where: twitch
    game:
        title: La partida
        hint: Modo historia
        heading: La partida, con el chat en voz alta
        text: "Juegos de historia, de miedo incluidos, aunque lo pase mal. Miro cada rincón, vuelvo por el cofre que me dejé y leo el chat en voz alta: lo que escribas acaba en el directo."
        where: twitch
    chatting:
        title: La charla
        hint: Just Chatting
        heading: Just Chatting, de lo que surja
        text: "Entre partida y partida, o un rato entero. Sin guion: la cámara grande, el chat al lado y lo que vaya saliendo."
        where: twitch
    after:
        title: Después
        hint: En YouTube
        heading: El directo se queda en YouTube
        text: Cada directo se sube entero, con su juego y su número de episodio, y de vez en cuando un editado con lo mejor. Para avisos y charla fuera del directo, está el Discord.
        where: youtube

# Franja habitual, no una cita. Sin `days` (monday…sunday), se muestra «Sin fijar».
schedule:
    start: "17:00"
    end: "20:00"
    zone: Hora peninsular

streams:
    - Juegos
    - Just Chatting

banner:
    eyebrow: Juegos y Just Chatting en Twitch

socials:
    - network: twitch
      text: El directo, cuando lo hay. El chat lo leo en voz alta.
      url: https://twitch.tv/jotis_1
    - network: youtube
      text: "El diario: directos resubidos y editados."
      url: https://www.youtube.com/@jotis_1
    # Sin `url` hasta tener la invitación: mientras tanto, Discord no se muestra.
    - network: discord
      text: Avisos y algo de charla.

rules:
    - Pórtate bien. Si no sabes cómo, la escuela sigue abierta.
    - Nada de spam.
    - Mi canal, mis normas. Si te parece injusto, hay más canales.

panels:
    - slug: de-que-va
      title: De qué va
      icon: info-circle
      from: description
    - slug: horario
      title: Horario
      icon: clock
      paragraphs:
          - Lo habitual, no una cita. Hay días sin directo y días en que la partida se alarga.
      rows: schedule
    - slug: normas
      title: Normas
      icon: shield-tick
      # Numeradas al pintar el panel: «1. Pórtate bien…».
      from: rules
    - slug: videos
      title: Vídeos
      icon: play
      paragraphs:
          - Los directos, subidos enteros, y algún editado con lo mejor.
      action:
          text: Ver en YouTube
          url: https://www.youtube.com/@jotis_1
    - slug: redes
      title: Redes
      icon: link-01
      paragraphs:
          - Para lo que pasa fuera del directo.
      rows: socials

scenes:
    starting:
        badge: Empezamos pronto
        title: Ya casi
        subtitle: Unos minutos y empezamos. Ve escribiendo, que el chat lo leo en voz alta.
    brb:
        badge: Pausa
        title: Vuelvo enseguida
        subtitle: Un momento y seguimos con la partida.
    ending:
        badge: Fin del directo
        title: Hasta la próxima
        subtitle: Gracias por pasarte. El directo queda en YouTube.
    offline:
        badge: Sin directo
        title: Ahora no estoy
        subtitle: Mientras tanto, los vídeos están en YouTube.

# Frases por defecto de cada alerta; el estudio permite cambiarlas (se guardan en Redis).
alerts:
    follow: Gracias por seguir el canal.
    sub: Gracias por suscribirte.
    resub: "{meses} meses ya. Gracias por seguir aquí."
    gift: "Ha regalado {cantidad} subs al chat. Gracias."
    raid: "Llega con {espectadores} personas. Bienvenidas."
    bits: "{bits} bits. Muchas gracias."

camera:
    name: Jotis

chat:
    # Usuarios cuyos mensajes no salen en el overlay (bots, por ejemplo). Los mensajes que empiezan por `!`
    # tampoco salen.
    hidden: []
